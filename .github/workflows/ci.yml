name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The pure-Go packages need no GTK or WebKit, so they run natively on both OSes.
      - run: go vet ./internal/... ./tools/...
      - run: go test -race ./internal/... ./tools/...

  build:
    name: build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          # One universal app covers Intel and Apple Silicon.
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41 -clean
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal -clean
      - name: Package
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent build/bin/nerder.app "dist/nerder-${{ matrix.name }}.zip"
          else
            pkg="nerder-${{ matrix.name }}"
            mkdir "dist/$pkg"
            install -m755 build/bin/nerder "dist/$pkg/nerder"
            install -m644 build/appicon.png "dist/$pkg/nerder.png"
            install -m755 packaging/linux/install.sh packaging/linux/uninstall.sh "dist/$pkg/"
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
            rm -r "dist/$pkg"
            # .deb and .rpm for the same architecture
            # The prebuilt binary avoids needing a newer Go toolchain than go.mod's.
            export GOARCH="$(go env GOARCH)"
            case "$GOARCH" in amd64) nfpm_arch=x86_64 ;; *) nfpm_arch=$GOARCH ;; esac
            nfpm_tar="nfpm_2.48.0_Linux_${nfpm_arch}.tar.gz"
            curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/$nfpm_tar"
            curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt"
            grep " $nfpm_tar\$" checksums.txt | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/nfpm" && tar -xzf "$nfpm_tar" -C "$RUNNER_TEMP/nfpm" nfpm
            export PATH="$RUNNER_TEMP/nfpm:$PATH"
            rm -f "$nfpm_tar" checksums.txt
            if [ "${GITHUB_REF_TYPE}" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0-dev; fi
            export VERSION
            for format in deb rpm; do
              nfpm package -p "$format" -f packaging/linux/nfpm.yaml -t dist
            done
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: nerder-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
